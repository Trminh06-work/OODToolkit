# Comma-separated module names from src/splitters and src/models.
MODULES="geometric_split,marginal_distribution_shift,random_split,statistical_models,tree_models,resnet,slip_interpolant,mlp"

# Wrapper action: pipeline runs the existing split/train/eval phases; visualize only calls main_visualize().
# Accepted values: pipeline, visualize. British spellings visualise/visualisation are also accepted.
RUN_MODE="pipeline"

# Comma-separated splitter class names. Leave empty to skip splitting.
SPLITTERS=""

# Comma-separated model class names. Leave empty when using ARRAY_MODELS sharding.
# Example (single-pass mode): MODELS="SLipInterpolant,RFRegressor"
MODELS=""

# Available model names:
# HuberLinearRegressor, HuberPolynomialRegressor, SVMRegressor, KNNRegressor,
# DTRegressor, RFRegressor, GBRegressor, ABRegressor, XGBRegressor, LightGBMRegressor,
# ResnetRegressor, SLipInterpolant

# Optional Slurm-array sharding over models. Each array task picks one value from this list
# using SLURM_ARRAY_TASK_ID and runs only that model.
# When BOTH ARRAY_MODELS and ARRAY_DATASETS are set, the array iterates the cartesian product:
# task t picks ARRAY_DATASETS[t / n_models] and ARRAY_MODELS[t % n_models].
# Total array size must equal n_datasets * n_models.
# ARRAY_MODELS="HuberLinearRegressor,HuberPolynomialRegressor,SVMRegressor,KNNRegressor,DTRegressor,RFRegressor,GBRegressor,ABRegressor,XGBRegressor,LightGBMRegressor,SLipInterpolant,ResnetRegressor"
ARRAY_MODELS=""

# Optional Slurm-array sharding over datasets. Each array task picks one value from this list
# using SLURM_ARRAY_TASK_ID and overrides DATASET_NAMES with only that dataset.
# When BOTH ARRAY_MODELS and ARRAY_DATASETS are set, see ARRAY_MODELS for cartesian-product semantics.
# ARRAY_DATASETS="synthetic_0-1000K-2d,synthetic_1-1000K-2d,synthetic_2-1000K-2d,synthetic_3-1000K-2d,synthetic_4-1000K-2d,synthetic_5-1000K-2d,synthetic_6-1000K-2d,synthetic_7-1000K-2d"
# ARRAY_DATASETS="synthetic_0-100000K-10d,synthetic_1-100000K-10d,synthetic_2-100000K-10d,synthetic_3-100000K-10d,synthetic_4-100000K-10d,synthetic_5-100000K-10d,synthetic_6-100000K-10d,synthetic_0-100000K-5d,synthetic_1-100000K-5d,synthetic_2-100000K-5d,synthetic_3-100000K-5d,synthetic_4-100000K-5d,synthetic_5-100000K-5d,synthetic_6-100000K-5d"
# ARRAY_DATASETS="synthetic_0-100000K-10d,synthetic_1-100000K-10d,synthetic_2-100000K-10d,synthetic_3-100000K-10d,synthetic_4-100000K-10d,synthetic_0-100000K-5d,synthetic_1-100000K-5d,synthetic_2-100000K-5d,synthetic_3-100000K-5d,synthetic_4-100000K-5d"
ARRAY_DATASETS=""

# Run the evaluation stage after splitting/training: true or false.
REQUIRE_EVAL="true"

# In split-wise tests, compare only baseline models: true or false.
SPLITWISE_BASELINE_ONLY="false"

# In split-wise tests, include model variants as competitors: true or false.
SPLITWISE_INCLUDE_VARIANTS="true"

# Run model-wise tests that compare split types for each model: true or false.
MODELWISE_EVAL="true"

# Print one full per-dataset nRMSE table (models x splits): true or false.
PER_DATASET_TABLE_EVAL="true"

# Print a runtime performance table (models x training/inference time): true or false.
RUNTIME_EVAL="true"

# Comma-separated dataset names. Leave empty to use all datasets found under data/raw.
# DATASET_NAMES="synthetic_0-100000K-3d,synthetic_1-100000K-3d,synthetic_2-100000K-3d,synthetic_3-100000K-3d,synthetic_4-100000K-3d,synthetic_5-100000K-3d,synthetic_6-100000K-3d,synthetic_0-100000K-10d,synthetic_1-100000K-10d,synthetic_2-100000K-10d,synthetic_3-100000K-10d,synthetic_4-100000K-10d,synthetic_5-100000K-10d,synthetic_6-100000K-10d,synthetic_0-100000K-5d,synthetic_1-100000K-5d,synthetic_2-100000K-5d,synthetic_3-100000K-5d,synthetic_4-100000K-5d,synthetic_5-100000K-5d,synthetic_6-100000K-5d"
# DATASET_NAMES="synthetic_0-100000K-5d,synthetic_1-100000K-5d,synthetic_2-100000K-5d,synthetic_3-100000K-5d,synthetic_4-100000K-5d,synthetic_5-100000K-5d,synthetic_6-100000K-5d"
DATASET_NAMES="synthetic_0-100000K-3d,synthetic_1-100000K-3d,synthetic_2-100000K-3d,synthetic_3-100000K-3d,synthetic_4-100000K-3d,synthetic_5-100000K-3d,synthetic_6-100000K-3d"


# Visualization-only settings used when RUN_MODE="visualize".
VISUALIZE_GRID_SIZE="100"
VISUALIZE_PLOT_KINDS="test_only,model_only,absolute_error,test_and_model,train_and_model,train_test_and_model"
VISUALIZE_SPLIT_NAMES="Random_Split"
VISUALIZE_RUN_IDS="0"

# Python executable to use inside the batch job.
